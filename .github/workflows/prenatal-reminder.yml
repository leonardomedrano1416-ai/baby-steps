name: Baby Steps Daily Reminders

on:
  workflow_dispatch:
  schedule:
    - cron: "7 8 * * *"
      timezone: "America/Chicago"

permissions:
  contents: read
  id-token: write

jobs:
  send-daily-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/737826285998/locations/global/workloadIdentityPools/baby-steps-github/providers/github"
          service_account: "firebase-adminsdk-fbsvc@baby-steps-2c470.iam.gserviceaccount.com"

      - name: Get Google access token
        id: google-auth
        run: |
          echo "ACCESS_TOKEN=$(gcloud auth print-access-token)" >> "$GITHUB_OUTPUT"

      - name: Send Dad's Corner reminder
        env:
          DAD_FCM_TOKEN: ${{ secrets.DAD_FCM_TOKEN }}
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.ACCESS_TOKEN }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://fcm.googleapis.com/v1/projects/baby-steps-2c470/messages:send" \
            -d "$(jq -n \
              --arg token "$DAD_FCM_TOKEN" \
              '{
                message: {
                  token: $token,
                  notification: {
                    title: "Dad'\''s Corner ♡",
                    body: "Don'\''t forget to write Microbia a little message today ♡"
                  },
                  webpush: {
                    fcm_options: {
                      link: "https://leonardomedrano1416-ai.github.io/baby-steps/"
                    }
                  }
                }
              }')"

      - name: Send Microbia's prenatal reminder
        env:
          MICROBIA_FCM_TOKEN: ${{ secrets.MICROBIA_FCM_TOKEN }}
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.ACCESS_TOKEN }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://fcm.googleapis.com/v1/projects/baby-steps-2c470/messages:send" \
            -d "$(jq -n \
              --arg token "$MICROBIA_FCM_TOKEN" \
              '{
                message: {
                  token: $token,
                  notification: {
                    title: "Baby Steps ♡",
                    body: "Good morning, Microbia ♡ Time to take your prenatal."
                  },
                  webpush: {
                    fcm_options: {
                      link: "https://leonardomedrano1416-ai.github.io/baby-steps/"
                    }
                  }
                }
              }')"

      - name: Check appointments and notify both phones
        env:
          DAD_FCM_TOKEN: ${{ secrets.DAD_FCM_TOKEN }}
          MICROBIA_FCM_TOKEN: ${{ secrets.MICROBIA_FCM_TOKEN }}
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.ACCESS_TOKEN }}
        run: |
          TODAY=$(TZ=America/Chicago date +%F)
          TOMORROW=$(TZ=America/Chicago date -d tomorrow +%F)

          APPOINTMENTS=$(curl --fail-with-body \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://firestore.googleapis.com/v1/projects/baby-steps-2c470/databases/(default)/documents/appointments")

          echo "$APPOINTMENTS" | jq -c '.documents[]?' | while read -r DOC; do
            DATE=$(echo "$DOC" | jq -r '.fields.date.stringValue // ""')
            TIME=$(echo "$DOC" | jq -r '.fields.time.stringValue // ""')
            TITLE=$(echo "$DOC" | jq -r '.fields.title.stringValue // "Appointment"')

            if [ "$DATE" = "$TODAY" ]; then
              NOTIFICATION_TITLE="Appointment Day ♡"
              BODY="You have $TITLE today"
              if [ -n "$TIME" ]; then
                BODY="$BODY at $TIME"
              fi
              BODY="$BODY ♡"

            elif [ "$DATE" = "$TOMORROW" ]; then
              NOTIFICATION_TITLE="Baby Steps ♡"
              BODY="You have an appointment tomorrow: $TITLE"
              if [ -n "$TIME" ]; then
                BODY="$BODY at $TIME"
              fi
              BODY="$BODY ♡"

            else
              continue
            fi

            for TOKEN in "$DAD_FCM_TOKEN" "$MICROBIA_FCM_TOKEN"; do
              curl --fail-with-body \
                -X POST \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                "https://fcm.googleapis.com/v1/projects/baby-steps-2c470/messages:send" \
                -d "$(jq -n \
                  --arg token "$TOKEN" \
                  --arg title "$NOTIFICATION_TITLE" \
                  --arg body "$BODY" \
                  '{
                    message: {
                      token: $token,
                      notification: {
                        title: $title,
                        body: $body
                      },
                      webpush: {
                        fcm_options: {
                          link: "https://leonardomedrano1416-ai.github.io/baby-steps/"
                        }
                      }
                    }
                  }')"
            done
          done
